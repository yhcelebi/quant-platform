name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: qp
          POSTGRES_USER: qp
          POSTGRES_PASSWORD: qp-ci-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U qp -d qp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      QP_DB__HOST: localhost
      QP_DB__PORT: "5433"
      QP_DB__PASSWORD: qp-ci-only
      QP_REQUIRE_DB: "1"
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install (dev group, locked)
        run: uv sync --locked
      - name: make check
        run: make check
      - name: Migrate and run qp doctor end to end
        run: |
          make migrate
          uv run qp doctor

  deps-smoke:
    name: research + trading deps smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: make deps-smoke
        run: make deps-smoke
