# Base settings. Precedence: base.yaml < configs/<mode>/*.yaml < environment / .env.
# NO SECRETS HERE: passwords and tokens come only from env/.env (a secret here is an error).
mode: paper            # backtest | paper | live. Default is paper.

db:
  host: localhost
  port: 5433           # 5433 avoids clashing with a host Postgres on 5432
  name: qp
  user: qp

lake:
  root: data/lake

manual:
  dir: data/manual      # prices.csv and fx.csv you maintain (phase 1 valuation)

sources:                # phase 2 connectors; API keys only via env/.env (QP_SOURCES__*__API_KEY)
  tcmb:
    enabled: true
    rate_kind: forex_buying   # TCMB döviz alış; values FX positions and cash (ADR 0008)
    min_interval_s: 1.0       # at most one request per second to tcmb.gov.tr
  evds:
    min_interval_s: 2.0
    start: 2015-01-01
    # Series codes to fetch. Empty until confirmed with a key (`qp data evds-series CODE`):
    # TP.FG.J0 (TÜFE 2003=100) is archived since TÜİK's 2025=100 rebase; candidates are
    # TP.TUKFIY2025.GENEL and TP.GENENDEKS.T1. Deposit rates: TP.TRY.MT01..MT06.
    series: []
  fred:
    min_interval_s: 1.0
    series: [CPIAUCSL, DGS10, DFF]   # US CPI (SA), 10y Treasury, Fed funds effective

log:
  level: INFO
  json_format: true

performance:            # ADR 0010
  # Monthly price index for the real TRY view: an EVDS code once confirmed with a key
  # (e.g. evds:TP.TUKFIY2025.GENEL), or any id you enter in data/manual/series.csv.
  # Empty: real figures are shown as unavailable.
  inflation_series: ""
  stale_after_days: 7
  benchmarks:           # unavailable until their data exists (manual prices.csv, lake, series.csv)
    - {name: USD/TRY, kind: fx, currency: USD}
    - {name: EUR/TRY, kind: fx, currency: EUR}
    - {name: BIST 100, kind: price, instrument: XU100.BIST}
    - {name: S&P 500 TR, kind: price, instrument: SPXTR.INDEX}
    - {name: Gold, kind: price, instrument: XAUUSD.SPOT}
    - {name: TRY deposit, kind: rate, series: TRY_DEPOSIT, scale: "0.01"}

risk:
  lookback_days: 250    # valuation days used for VaR/ES
  min_observations: 60  # fewer fresh daily returns: figure unavailable

alerts:                 # evaluated after the evening TCMB fetch; Telegram if configured
  enabled: true
  daily_loss: "0.03"    # alert when the day's TWR return is below -3%
  drawdown: "0.10"      # alert when the drawdown from the peak exceeds 10%
  var_level: 0.99       # alert when the day's loss exceeds the previous day's 99% VaR
  stale_price_days: 7
